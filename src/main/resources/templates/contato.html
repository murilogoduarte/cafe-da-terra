<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatos | Café da Terra</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f5eee4;
            color: #382318;
            font-family: Georgia, "Times New Roman", serif;
        }

        header, footer {
            background-color: #382318;
            color: white;
            padding: 20px;
        }

        .btn-cafe {
            background-color: #49663b;
            color: white;
        }

        .btn-cafe:hover {
            background-color: #354d2c;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <nav class="container d-flex justify-content-between align-items-center">
        <h2>Café da Terra</h2>
        <a th:href="@{/}" class="text-white">Início</a>
    </nav>
</header>

<main class="container py-5">

    <h1 class="text-center mb-4">Entre em contato</h1>

    <div class="text-center mb-4">
        <p><strong>Telefone:</strong> (11) 99999-9999</p>
        <p><strong>E-mail:</strong> contato@cafedaterra.com.br</p>
        <p><strong>Endereço:</strong> Rua das Flores, 123 - São Paulo, SP</p>
        <p><strong>Horário:</strong> Segunda a sábado, das 8h às 18h</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-7">

            <h3 class="text-center mb-3">Envie uma mensagem</h3>

            <form action="#" method="post">

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" id="nome" name="nome"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" name="email"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="mensagem" class="form-label">Mensagem</label>
                    <textarea id="mensagem" name="mensagem"
                              class="form-control" rows="4"
                              required></textarea>
                </div>

                <button type="submit" class="btn btn-cafe w-100">
                    Enviar mensagem
                </button>

            </form>

        </div>
    </div>

</main>

<footer class="text-center">
    <p class="mb-0">&copy; 2026 Café da Terra. Todos os direitos reservados.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
